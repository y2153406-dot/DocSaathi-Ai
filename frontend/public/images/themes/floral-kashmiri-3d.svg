<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="kashmirNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D0A" />
      <stop offset="50%" stop-color="#091A14" />
      <stop offset="100%" stop-color="#122E23" />
    </linearGradient>

    <linearGradient id="chinarAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <linearGradient id="mountainSnow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#A7D5C4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0E241B" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="lakeMistGlow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <filter id="leafGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shikaraShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#020805" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Kashmiri Lake Night -->
  <rect width="1920" height="1080" fill="url(#kashmirNight)" />
  <circle cx="1200" cy="550" r="700" fill="url(#lakeMistGlow)" />

  <!-- Snow-capped Pir Panjal Mountain Peaks (3D Depth Layer 1 - Background) -->
  <g opacity="0.45">
    <polygon points="120,480 380,240 580,480" fill="url(#mountainSnow)" />
    <polygon points="460,480 720,180 980,480" fill="url(#mountainSnow)" />
    <polygon points="860,480 1180,140 1480,480" fill="url(#mountainSnow)" />
    <polygon points="1380,480 1620,210 1860,480" fill="url(#mountainSnow)" />
    <!-- Ridge Shading -->
    <path d="M720 180 L760 480 M1180 140 L1220 480 M1620 210 L1650 480" stroke="#061A12" stroke-width="6" opacity="0.4" />
  </g>

  <!-- Dal Lake Water Surface with Calm Shimmer Ripples -->
  <rect x="0" y="480" width="1920" height="600" fill="#040F0B" opacity="0.8" />
  <g stroke="#34D399" stroke-width="1.2" opacity="0.25">
    <ellipse cx="960" cy="560" rx="800" ry="12" fill="none" />
    <ellipse cx="960" cy="640" rx="900" ry="16" fill="none" />
    <ellipse cx="960" cy="740" rx="1000" ry="20" fill="none" />
    <ellipse cx="960" cy="860" rx="1100" ry="24" fill="none" />
  </g>

  <!-- 3D Dal Lake Shikara Boat in Midground Perspective -->
  <g transform="translate(480, 560)" filter="url(#shikaraShadow)">
    <!-- Water Ripple under boat -->
    <ellipse cx="480" cy="180" rx="460" ry="22" fill="#020805" opacity="0.6" />
    
    <!-- Wooden Boat Hull (Curved slender pointed prow and stern) -->
    <path d="M60 120 C180 160 380 180 600 180 C820 180 960 150 1060 90 C960 160 760 210 520 210 C280 210 120 170 60 120 Z" fill="#78350F" />
    <path d="M50 110 C180 150 380 170 600 170 C820 170 950 140 1060 90 L1070 105 C960 160 760 200 520 200 C280 200 120 160 50 110 Z" fill="#9A3412" />

    <!-- Ornate Roof Canopy with Lacquered Floral Drapes -->
    <g transform="translate(320, -40)">
      <!-- 4 Carved Wooden Corner Pillars -->
      <line x1="60" y1="180" x2="60" y2="40" stroke="#B45309" stroke-width="8" stroke-linecap="round" />
      <line x1="420" y1="180" x2="420" y2="40" stroke="#B45309" stroke-width="8" stroke-linecap="round" />
      <line x1="100" y1="170" x2="100" y2="35" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
      <line x1="380" y1="170" x2="380" y2="35" stroke="#78350F" stroke-width="6" stroke-linecap="round" />
      
      <!-- Canopy Roof -->
      <path d="M40 40 Q240 -15 440 40 L450 60 Q240 10 30 60 Z" fill="#F59E0B" filter="url(#leafGlow)" />
      <!-- Floral Scalloped Valance / Curtain -->
      <path d="M40 60 Q90 90 140 60 Q190 90 240 60 Q290 90 340 60 Q390 90 440 60" fill="none" stroke="#FEF08A" stroke-width="4" />
      <!-- Hanging Lantern under Canopy -->
      <line x1="240" y1="20" x2="240" y2="80" stroke="#FEF08A" stroke-width="2" />
      <circle cx="240" cy="90" r="14" fill="#FEF08A" filter="url(#leafGlow)" />
    </g>

    <!-- Traditional Heart-shaped Oar resting on side -->
    <path d="M180 80 L60 220" stroke="#9A3412" stroke-width="6" />
    <path d="M45 220 C35 200 50 190 60 200 C70 190 85 200 75 220 L60 240 Z" fill="#D97706" />
  </g>

  <!-- Floating 3D Glowing Chinar Leaves (Five-pointed iconic Kashmiri leaves) in Perspective -->
  <!-- Leaf 1: Close Foreground, Floating with tilt -->
  <g transform="translate(1380, 240) rotate(22) scale(1.3)" filter="url(#leafGlow)">
    <path d="M0 -60 C12 -40 38 -45 42 -20 C52 -18 68 -5 54 18 C64 28 55 48 34 42 C28 56 12 65 0 80 C-12 65 -28 56 -34 42 C-55 48 -64 28 -54 18 C-68 -5 -52 -18 -42 -20 C-38 -45 -12 -40 0 -60 Z" fill="url(#chinarAmber)" stroke="#FEF08A" stroke-width="1.5" />
    <!-- Leaf Veins -->
    <line x1="0" y1="80" x2="0" y2="-50" stroke="#78350F" stroke-width="2.5" />
    <path d="M0 40 L28 15 M0 40 L-28 15 M0 10 L35 -10 M0 10 L-35 -10 M0 -20 L25 -38 M0 -20 L-25 -38" stroke="#78350F" stroke-width="1.8" />
  </g>

  <!-- Leaf 2: Midground floating left -->
  <g transform="translate(320, 360) rotate(-35) scale(0.9)" filter="url(#leafGlow)">
    <path d="M0 -60 C12 -40 38 -45 42 -20 C52 -18 68 -5 54 18 C64 28 55 48 34 42 C28 56 12 65 0 80 C-12 65 -28 56 -34 42 C-55 48 -64 28 -54 18 C-68 -5 -52 -18 -42 -20 C-38 -45 -12 -40 0 -60 Z" fill="url(#chinarAmber)" stroke="#FEF08A" stroke-width="1.2" />
    <line x1="0" y1="80" x2="0" y2="-50" stroke="#78350F" stroke-width="2" />
  </g>

  <!-- Leaf 3: Background floating high -->
  <g transform="translate(890, 180) rotate(15) scale(0.65)" opacity="0.8" filter="url(#leafGlow)">
    <path d="M0 -60 C12 -40 38 -45 42 -20 C52 -18 68 -5 54 18 C64 28 55 48 34 42 C28 56 12 65 0 80 C-12 65 -28 56 -34 42 C-55 48 -64 28 -54 18 C-68 -5 -52 -18 -42 -20 C-38 -45 -12 -40 0 -60 Z" fill="url(#chinarAmber)" />
  </g>

  <!-- Floating Glowing Amber Spores & Lake Fireflies -->
  <g filter="url(#leafGlow)" opacity="0.75">
    <circle cx="280" cy="620" r="4.5" fill="#FEF08A" />
    <circle cx="680" cy="460" r="5" fill="#F59E0B" />
    <circle cx="1140" cy="380" r="6" fill="#FEF08A" />
    <circle cx="1580" cy="520" r="4" fill="#34D399" />
    <circle cx="980" cy="710" r="3.5" fill="#FEF08A" />
    <circle cx="1420" cy="680" r="5" fill="#F59E0B" />
  </g>
</svg>