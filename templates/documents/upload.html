
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocSaathi AI - Upload Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .upload-card {
            max-width: 600px;
        }

        .analysis-card {
            max-width: 900px;
        }

        .analysis-content {
            line-height: 1.8;
            overflow-wrap: anywhere;
            font-size: 15px;
        }

        .analysis-content p {
            margin-bottom: 12px;
        }

        .analysis-content h1,
        .analysis-content h2,
        .analysis-content h3,
        .analysis-content h4 {
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .analysis-content ul,
        .analysis-content ol {
            padding-left: 25px;
            margin-bottom: 16px;
        }

        #image-preview {
            max-height: 350px;
            width: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <div class="container mt-5 mb-5">

        <!-- Page Heading -->
        <h1 class="text-center">
            Welcome to DocSaathi AI
        </h1>

        <p class="text-center text-muted">
            Upload your document to understand it better.
        </p>


        <!-- Document Upload Card -->
        <div class="card upload-card mx-auto mt-4 shadow-sm">

            <div class="card-body">

                <h4 class="card-title mb-4">
                    Upload Document
                </h4>

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}


                    <!-- Image Preview Section -->
                    <div id="preview-container" class="mt-4 d-none">

                        <h5 class="mb-3">
                            Document Preview
                        </h5>

                        <div class="card p-3">

                            <img
                                id="image-preview"
                                src=""
                                alt="Selected Document Preview"
                                class="img-fluid rounded"
                            >

                            <div class="d-flex gap-2 mt-3">

                                <button
                                    type="button"
                                    id="replace-image"
                                    class="btn btn-outline-primary flex-fill"
                                >
                                    Replace Image
                                </button>

                                <button
                                    type="button"
                                    id="remove-image"
                                    class="btn btn-outline-danger flex-fill"
                                >
                                    Remove Image
                                </button>

                            </div>

                        </div>

                    </div>


                    <!-- Upload Button -->
                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        Upload Document
                    </button>

                </form>

            </div>

        </div>


        <!-- Error Message Section -->
        {% if error_message %}

        <div class="alert alert-danger mx-auto mt-4"
             style="max-width: 600px;"
             role="alert">

            <h5 class="alert-heading">
                Document Analysis Failed
            </h5>

            <p class="mb-0">
                {{ error_message }}
            </p>

        </div>

        {% endif %}


        <!-- AI Document Analysis Section -->
        {% if analysis_html %}

        <div class="card analysis-card mx-auto mt-5 shadow-sm">

            <div class="card-body p-4">

                <h4 class="card-title mb-3">
                    AI Document Analysis
                </h4>

                <hr>

                <div class="analysis-content">
                    {{ analysis_html }}
                </div>

            </div>

        </div>

        {% endif %}

    </div>


    <!-- Image Preview JavaScript -->
    <script>

        const imageInput = document.getElementById('id_image');

        const previewContainer = document.getElementById('preview-container');

        const imagePreview = document.getElementById('image-preview');

        const replaceButton = document.getElementById('replace-image');

        const removeButton = document.getElementById('remove-image');


        // Check if upload elements exist
        if (
            imageInput &&
            previewContainer &&
            imagePreview &&
            replaceButton &&
            removeButton
        ) {

            // Image Selection
            imageInput.addEventListener('change', function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }


                // Validate Image Type
                if (!file.type.startsWith('image/')) {

                    alert('Please select a valid image file.');

                    this.value = '';

                    return;
                }


                // Read Selected Image
                const reader = new FileReader();

                reader.onload = function (event) {

                    imagePreview.src = event.target.result;

                    previewContainer.classList.remove('d-none');

                };

                reader.readAsDataURL(file);

            });


            // Replace Image
            replaceButton.addEventListener('click', function () {

                imageInput.click();

            });


            // Remove Image
            removeButton.addEventListener('click', function () {

                imageInput.value = '';

                imagePreview.src = '';

                previewContainer.classList.add('d-none');

            });

        }

    </script>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
