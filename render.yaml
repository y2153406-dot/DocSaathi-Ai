# Render Deployment Blueprint for DocSaathi AI
# Documentation: https://render.com/docs/blueprint-spec

services:
  # =========================================================================
  # 1. Django REST Backend Web Service
  # =========================================================================
  - type: web
    name: docsaathi-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_API_KEY
        sync: false

  # =========================================================================
  # 2. Next.js Frontend Web Service
  # =========================================================================
  - type: web
    name: docsaathi-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: docsaathi-backend
          property: host
