<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="monasteryNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A05" />
      <stop offset="50%" stop-color="#1A1208" />
      <stop offset="100%" stop-color="#2D1C0F" />
    </linearGradient>

    <linearGradient id="parchmentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="sacredCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <radialGradient id="yantraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <filter id="sacredGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="manuscriptShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#050302" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Deep Ancient Library Atmosphere -->
  <rect width="1920" height="1080" fill="url(#monasteryNight)" />

  <!-- Sacred 3D Concentric Sri Yantra / Mandala Geometry in Background -->
  <g transform="translate(960, 420)" filter="url(#sacredGlow)" opacity="0.38">
    <circle cx="0" cy="0" r="320" fill="url(#yantraGlow)" />
    <circle cx="0" cy="0" r="280" fill="none" stroke="#FBBF24" stroke-width="2" />
    <circle cx="0" cy="0" r="240" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 6" />
    <!-- Intersecting 9 Triangles of Sri Yantra -->
    <polygon points="0,-220 190,110 -190,110" fill="none" stroke="#FEF08A" stroke-width="2" />
    <polygon points="0,220 -190,-110 190,-110" fill="none" stroke="#FEF08A" stroke-width="2" />
    <polygon points="0,-180 150,90 -150,90" fill="none" stroke="#F59E0B" stroke-width="1.8" />
    <polygon points="0,180 -150,-90 150,-90" fill="none" stroke="#F59E0B" stroke-width="1.8" />
    <polygon points="0,-140 120,70 -120,70" fill="none" stroke="#FDE047" stroke-width="1.5" />
    <polygon points="0,140 -120,-70 120,-70" fill="none" stroke="#FDE047" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="#FFFBEB" />
  </g>

  <!-- Ancient Nalanda Monastery Stone Arches (3D Colonnade Depth) -->
  <g opacity="0.5" stroke="url(#sacredCopper)" stroke-width="4" fill="none">
    <!-- Left Colonnade Arch -->
    <path d="M-40 1080 V420 C-40 260 80 180 240 180 C400 180 520 260 520 420 V1080" />
    <path d="M40 1080 V460 C40 320 120 240 240 240 C360 240 440 320 440 460 V1080" stroke-width="2" opacity="0.6" />
    
    <!-- Right Colonnade Arch -->
    <path d="M1400 1080 V420 C1400 260 1520 180 1680 180 C1840 180 1960 260 1960 420 V1080" />
    <path d="M1480 1080 V460 C1480 320 1560 240 1680 240 C1800 240 1880 320 1880 460 V1080" stroke-width="2" opacity="0.6" />
  </g>

  <!-- 3D Floating Palm-Leaf (Tala-Patra) & Birch-Bark (Bhojpatra) Folios with Perspective Tilt -->
  <!-- Folio 1: Main Centerpiece Folio, Floating at Angle -->
  <g transform="translate(680, 520) rotate(-7)" filter="url(#manuscriptShadow)">
    <!-- 3D Beveled Folio Base -->
    <rect x="0" y="0" width="620" height="140" rx="14" fill="url(#parchmentGold)" stroke="#D97706" stroke-width="3" />
    
    <!-- Antique Margin Lines & Binding Cord Holes -->
    <line x1="30" y1="20" x2="590" y2="20" stroke="#9A3412" stroke-width="1.5" />
    <line x1="30" y1="120" x2="590" y2="120" stroke="#9A3412" stroke-width="1.5" />
    
    <!-- Left & Right Sacred Binding Cord Apertures -->
    <circle cx="120" cy="70" r="10" fill="#20160D" stroke="#B45309" stroke-width="2" />
    <circle cx="500" cy="70" r="10" fill="#20160D" stroke="#B45309" stroke-width="2" />
    
    <!-- Flowing Red Vermilion Silk Binding Ribbon -->
    <path d="M120 70 Q160 180 220 140 Q280 100 320 220" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round" />
    
    <!-- Sanskrit Devanagari Calligraphy Lines (Simulated text stripes) -->
    <g stroke="#78350F" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="160" y1="45" x2="460" y2="45" stroke-dasharray="14 6 22 8 18 5 30 8" />
      <line x1="160" y1="65" x2="460" y2="65" stroke-dasharray="20 7 12 5 26 8 16 6" />
      <line x1="160" y1="85" x2="460" y2="85" stroke-dasharray="16 5 28 8 14 6 24 7" />
    </g>
  </g>

  <!-- Folio 2: Smaller Background Folio Receding in Depth -->
  <g transform="translate(420, 340) rotate(14) scale(0.72)" opacity="0.65" filter="url(#manuscriptShadow)">
    <rect x="0" y="0" width="560" height="120" rx="10" fill="url(#parchmentGold)" stroke="#B45309" stroke-width="2" />
    <circle cx="100" cy="60" r="8" fill="#140E08" />
    <circle cx="460" cy="60" r="8" fill="#140E08" />
    <g stroke="#78350F" stroke-width="2" opacity="0.7">
      <line x1="140" y1="45" x2="420" y2="45" stroke-dasharray="16 6 24 8" />
      <line x1="140" y1="75" x2="420" y2="75" stroke-dasharray="22 7 18 5" />
    </g>
  </g>

  <!-- 3D Antique Deepam / Clay Diya with Sacred Flame -->
  <g transform="translate(1260, 680)" filter="url(#manuscriptShadow)">
    <!-- Terracotta Diya Bowl -->
    <ellipse cx="60" cy="70" rx="55" ry="24" fill="#9A3412" />
    <ellipse cx="60" cy="66" rx="46" ry="18" fill="#D97706" />
    <path d="M100 66 L124 55 L106 72 Z" fill="#78350F" />
    
    <!-- Glowing Flame & Volumetric Amber Light -->
    <ellipse cx="120" cy="50" rx="30" ry="30" fill="url(#yantraGlow)" />
    <path d="M124 55 Q135 30 120 10 Q105 30 116 55 Z" fill="#FFFBEB" filter="url(#sacredGlow)" />
    <path d="M124 55 Q130 35 120 18 Q110 35 116 55 Z" fill="#F59E0B" filter="url(#sacredGlow)" />
  </g>

  <!-- Floating Sacred Dust & Gold Mote Particles -->
  <g filter="url(#sacredGlow)" opacity="0.7">
    <circle cx="380" cy="620" r="4.5" fill="#FDE047" />
    <circle cx="740" cy="380" r="5" fill="#FEF08A" />
    <circle cx="1180" cy="290" r="6" fill="#FDE047" />
    <circle cx="1520" cy="540" r="4" fill="#FEF08A" />
    <circle cx="890" cy="740" r="4" fill="#F59E0B" />
    <circle cx="1380" cy="420" r="5" fill="#FDE047" />
  </g>
</svg>